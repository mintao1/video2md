# video2md + gpu_router 生产编排（lcode-4c）。
# 目录约定：两仓库同级（默认 ../gpu_router；可用 GPU_ROUTER_DIR 环境变量覆盖，
# 如 Mac 上 GPU_ROUTER_DIR=~/Desktop/开发项目/gpu_router）。
# 凭证：secrets/ 目录（gitignore，部署时手工放）：
#   secrets/video2md.env      → LLM_BASE_URL/LLM_API_KEY/LLM_MODEL（挂进容器由 V2MD_SECRETS_FILE 读）
#   secrets/gpu_router.env    → 代理 env（HTTP_PROXY/HTTPS_PROXY/ALL_PROXY/NO_PROXY，可选但强烈建议）
#   secrets/colab-cli/token.json、secrets/kaggle/kaggle.json（可选，缺了对应 provider 自动冷却）
name: video2md

networks:
  internal: {}

volumes:
  v2md-data: {}        # state.json / runs.json / checkpoints.sqlite / logs
  vault: {}            # 笔记产物（Syncthing 同步回本地 Obsidian 的就是这个卷）
  gpu-router-logs: {}  # provider 冷却/用量记账

services:
  gpu_router:
    build:
      context: ${GPU_ROUTER_DIR:-../gpu_router}
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}   # 国内机构建传清华镜像，见 README 部署章
    image: video2md-gpu-router
    restart: unless-stopped
    # host 网络：Colab/Kaggle/HF 的出墙代理是宿主机 127.0.0.1:17897（Mac 的 SSH 隧道转发），
    # 桥接网络够不到宿主回环——host 网络直连。9700 监听全接口但安全组不放行（无认证不暴露公网）
    network_mode: host
    volumes:
      - ${GPU_ROUTER_DIR:-../gpu_router}/gpu_router.docker.json:/app/gpu_router.json:ro
      - gpu-router-logs:/app/logs
      - ./secrets/colab-cli:/root/.config/colab-cli   # rw：OAuth token 刷新要回写 token.json
      - ./secrets/kaggle:/root/.kaggle:ro
    env_file:
      - path: ./secrets/gpu_router.env   # HTTP_PROXY=http://127.0.0.1:17897 等
        required: false

  video2md:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: video2md
    restart: unless-stopped
    depends_on:
      gpu_router:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"   # gpu_router 在 host 网络上，经宿主网关可达
    ports:
      - "127.0.0.1:8790:8790"   # 无认证服务：默认只绑回环，外用 SSH 隧道/nginx 反代（README 有做法）
    environment:
      TZ: Asia/Shanghai
      V2MD_SECRETS_FILE: /run/video2md.env
      V2MD_REMOTE: http://host.docker.internal:9700
      V2MD_OCR_REMOTE: http://host.docker.internal:9700
      V2MD_CLIPS_REMOTE: http://host.docker.internal:9700
      V2MD_CLIPS_SOURCE: remote
      OBSIDIAN_VAULT: /vault
      # 国内平台直连；YouTube 等境外源在服务器上需另行配代理（README 有说明）
      NO_PROXY: "host.docker.internal,127.0.0.1,localhost"
    volumes:
      - v2md-data:/app/data
      - vault:/vault
      - ./secrets/video2md.env:/run/video2md.env:ro
    networks: [internal]
