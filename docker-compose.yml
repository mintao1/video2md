# video2md 生产编排（云服务器 · 多用户）。GPU 算力池已解耦独立成栈（2026-09-26
# ADR-0012）：gpu_router 以自有 compose 运行于 ../gpu_router（deploy/cloud/），
# 本栈只作回环消费者（V2MD_*_REMOTE=127.0.0.1:9700 + V2MD_POOL_TOKEN Bearer）。
# 凭证：secrets/ 目录（gitignore，部署时手工放）：
#   secrets/video2md.env      → LLM_BASE_URL/LLM_API_KEY/LLM_MODEL（挂进容器由 V2MD_SECRETS_FILE 读）
#   （colab-cli/kaggle/gpu_router.env 已随算力池解耦迁至 gpu_router 栈 secrets/，ADR-0012）
name: video2md

volumes:
  v2md-data: {}        # state.json / runs.json / checkpoints.sqlite / logs
  vault: {}            # vault 模式产物卷（deliver 多用户形态不用此卷）
  v2md-pg: {}          # Postgres checkpointer 数据（仅 --profile pg 时用到）

services:

  video2md:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: video2md
    restart: unless-stopped
    # host 网络：① 算力池/队列都在宿主回环（127.0.0.1:9700 / :8790）；② yt-dlp 子进程
    # 走 V2MD_PROXY 绕国内站对机房 IP 的风控（代理侧需大陆住宅出口，见 README「出网与风控」）。
    # api 绑定 V2MD_HOST=127.0.0.1 只露回环——公网唯一入口 = 反代 TLS（见 README 部署章）；
    # 多用户生产档键（V2MD_AUTH / ARTIFACT_MODE / CORS_ORIGINS / GOOGLE_CLIENT_ID…）
    # 进 secrets/video2md.env（由 V2MD_SECRETS_FILE 读，不走 compose env）
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      V2MD_HOST: 127.0.0.1
      V2MD_TRUST_XFF: "on"   # P0-2：唯一入口=本机 nginx（deploy/nginx.conf），XFF 尾位=真实客户端
      V2MD_ENV: production   # 遥测环境标签（Langfuse 分项目）+ 生产档位：强制 V2MD_AUTH≠off
                           # （config.py import 期 fail-fast，P0-1；V2MD_AUTH 在 secrets 文件里配）
      # 执行层档位进 secrets/video2md.env 按服务器核数调（键义见 .env.example）：
      #   V2MD_MAX_CONCURRENT_RUNS=2 起 + V2MD_QUEUE_MAX/V2MD_USER_QUEUE_MAX；
      #   并发>1 时 checkpointer 配套切 postgres（V2MD_CHECKPOINTER=postgres + PG_DSN）
      V2MD_SECRETS_FILE: /run/video2md.env
      V2MD_REMOTE: http://127.0.0.1:9700
      V2MD_OCR_REMOTE: http://127.0.0.1:9700
      V2MD_CLIPS_REMOTE: http://127.0.0.1:9700
      V2MD_CLIPS_SOURCE: remote
      # 遥测出口=平台统一观测栈 collector（PLATFORM-ROADMAP Phase 1.1/M1，2026-09-26 双栈
      # 合并后从 docker-compose.obs.yml override 平移至此——栈不启时 OTLP 推送失败仅无指标）
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      V2MD_PROXY: http://127.0.0.1:17898
      V2MD_PROXY_DOMESTIC: "1"
      # run 卡死看门狗：生产配 exit——标 error 后进程退出（码 70），restart 自愈并恢复队列；
      # 开发机默认 mark（只标记+告警，不动进程）。详见 video2md/watchdog.py 模块注释
      V2MD_WATCHDOG_ACTION: exit
      OBSIDIAN_VAULT: /vault
    volumes:
      - v2md-data:/app/data
      - vault:/vault
      - ./secrets/video2md.env:/run/video2md.env:ro

  # Postgres checkpointer（可选，profile "pg"）：默认 sqlite 零外部服务；
  # 切库 = 起这条 + 在 secrets/video2md.env 里配两行（load_env 读 secrets 文件，
  # api 无需 compose env 透传）：
  #   V2MD_CHECKPOINTER=postgres
  #   V2MD_PG_DSN=postgresql://v2md:<密码>@127.0.0.1:5432/v2md
  # 多实例/云上持久档（可选，同 DSN 共享连接池）：
  #   V2MD_RUNS_STORE / V2MD_STATE_STORE / V2MD_USERS_STORE = postgres
  #   + V2MD_EVENTS=pg（SSE 事件跨进程扇出）+ V2MD_TASKS_STORE=postgres
  #     （任务表 PG 真相源：/queue·配额·dedup·watchdog 大盘巡检·启动认领恢复走 DB，多副本安全）
  #   ——切换前先 scripts/migrate_json_to_pg.py 导入存量
  # 起法：docker compose --profile pg up -d（外部/托管 PG 则不起这条，DSN 直接指过去）
  # ⚠ 刻意不用 depends_on：compose 的 depends_on 会无视 profile 强制拉起被依赖服务；
  #   PG 未就绪时 api fail-fast，靠 restart: unless-stopped 秒级自重启等库。
  postgres:
    image: postgres:17-alpine
    profiles: ["pg"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"   # 只绑回环：host 网络的 api 走回环访问，公网不可达
    environment:
      POSTGRES_USER: v2md
      POSTGRES_DB: v2md
      POSTGRES_PASSWORD: ${V2MD_PG_PASSWORD:-v2md-loopback-only}  # 生产用环境变量/宿主 .env 覆盖，与 DSN 同值
    volumes:
      - v2md-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v2md -d v2md"]
      interval: 5s
      timeout: 3s
      retries: 12
