[project]
name = "dify-video2md"
version = "0.1.0"
description = "视频 → Obsidian 笔记 + Dify RAG（本地转写/抽帧 OCR + Dify Cloud LLM 整理）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.4",
    "pyobjc-framework-Vision>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
    "pyyaml>=6.0.3",
    "websocket-client>=1.8",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
