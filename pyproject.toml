[project]
name = "video2md"
version = "0.2.0"
description = "视频 → Obsidian 笔记（LangGraph 编排：本地转写/抽帧 OCR + LLM 整理；Dify 已抽离）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.4",
    "pyyaml>=6.0.3",
    "websocket-client>=1.8",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",  # POST /uploads（multipart 流式上传面；镜像 --no-dev 也要有）
    "yt-dlp>=2025.9.0",
    "uvicorn>=0.30",
    # 遥测出口（OTel SDK：traces+metrics → 本机 collector；未配端点时零开销纯 jsonl）
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "google-auth>=2.58.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
]

[project.optional-dependencies]
# macOS 本地开发：Vision 框架 OCR（Linux/云服务器不装，OCR 走 V2MD_OCR_REMOTE 远程池）
mac = [
    "pyobjc-framework-Vision>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
]
# 评测旁路（scripts/eval_notes.py；judge 走自有 LLM 端点；ragas 带入 langchain-core，
# 仅此路径 import，graph 运行时不染）
evals = [
    "deepeval>=3.0",
    "ragas>=0.3",
    "langfuse>=3.0",
    # ragas 0.4.3 仍 import langchain_community.chat_models.vertexai——该模块在
    # langchain-community 0.4 被删（包已 sunset），钉 0.3 系否则 ragas 整体 import 失败
    "langchain-community>=0.3.27,<0.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# 保守集：pyflakes + 关键 pycodestyle + isort；不动现有代码风格
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
# langgraph/httpx 等无内联桩，缺桩不报错
ignore_missing_imports = true
# 非 strict 起步：函数体内部类型错误也查
check_untyped_defs = true
