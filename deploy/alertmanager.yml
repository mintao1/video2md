# Alertmanager：video2md 告警路由（2026-09-23）。
# 唯一 receiver = 本机 feishu 转译器（deploy/feishu_webhook.py，127.0.0.1:9760）：
# AM 原生不支持飞书卡片格式，转译器持密钥（FEISHU_WEBHOOK_URL，secrets/obs.env）——
# 本文件不含任何密钥，可进 git。
# 端到端：Prometheus 规则（deploy/prometheus-rules.yml）→ 本文件路由 → 转译器 → 飞书群。
route:
  receiver: feishu
  group_by: [alertname, severity]
  group_wait: 30s        # 同组告警聚齐再发（省轰炸）
  group_interval: 5m
  # 分级重发：critical 4h 提醒一次，warning 12h（在 severity 子路由里覆盖）
  repeat_interval: 12h
  routes:
    - matchers: [severity="critical"]
      receiver: feishu
      repeat_interval: 4h

receivers:
  - name: feishu
    webhook_configs:
      # resolve_timeout 只影响 Klinge…无关项；send_resolved=True：恢复也通知（飞书卡片绿色「已恢复」）
      - url: http://127.0.0.1:9760/alert
        send_resolved: true

# 全局抑制：任一 critical 触发时抑制全部 warning（如 Video2mdSilent 响起时 RunFailed 的
# increase() 表达式也会因数据断流而触发，避免双重轰炸）。
# 不带 equal：所有告警同 job（video2md），critical 即代表整体故障，warning 全是噪音。
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
