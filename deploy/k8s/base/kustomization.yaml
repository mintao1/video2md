# Phase 6: 引用平台 shared components，消灭 RBAC/NetworkPolicy/ResourceQuota 拷贝
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: video2md

resources:
  - namespace.yaml
  - deployment-api.yaml
  - service.yaml
  - networkpolicy.yaml

components:
  - ../../../../templates/k8s-base/components/security-baseline
  - ../../../../templates/k8s-base/components/rbac
  # - ../../../../templates/k8s-base/components/networking
  # ⚠️ 上面那行故意注释掉（2026-10-06）。共享 component 的 nginx 边缘那条规则
  # 还带 ipBlock: 10.42.0.0/16（放行整个节点网段），而线上没有——照它 apply 会
  # 顺手放宽入站面。本轮只做 selector/quota 对齐，故本产品自带
  # networkpolicy.yaml（见上方 resources），规则逐条抄自线上。
  - ../../../../templates/k8s-base/components/common-config
  - ../../../../templates/k8s-base/components/resourcequota

# RBAC replacements: namespace resource → NAMEHOLDER
replacements:
  - source:
      kind: Namespace
      name: video2md
      fieldPath: metadata.name
    targets:
      - select:
          kind: ServiceAccount
        fieldPaths:
          - metadata.name
          - metadata.namespace
      - select:
          kind: Role
        fieldPaths:
          - metadata.name
          - metadata.namespace
      - select:
          kind: RoleBinding
        fieldPaths:
          - metadata.name
          - metadata.namespace
          - roleRef.name
          - subjects.0.name
          - subjects.0.namespace

labels:
  - pairs:
      app.kubernetes.io/part-of: lcode-platform
      # ⚠️ 删掉 app.kubernetes.io/name 与 includeSelectors（2026-10-06）。
      # includeSelectors 把标签注入 spec.selector.matchLabels，而 selector 是
      # immutable 字段；线上本负载的 selector 不含 part-of（部署早于该标签），
      # 注入即造成永久性 apply 失败。去掉后 selector 回到 base 文件自己的
      # {component: api, name: video2md}，与线上一致，apply 恢复可用。
      # labels 仍写入 metadata.labels 与 Pod 模板标签，不影响任何选 Pod 逻辑。
