# video2md RBAC（平台基线：最小权限 ServiceAccount）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: video2md
  namespace: video2md
  labels:
    app.kubernetes.io/name: video2md
    app.kubernetes.io/part-of: lcode-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: video2md
  namespace: video2md
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: video2md
  namespace: video2md
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: video2md
subjects:
  - kind: ServiceAccount
    name: video2md
    namespace: video2md