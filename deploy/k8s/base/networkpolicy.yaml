# 本产品的 NetworkPolicy——**不用**共享的 components/networking（2026-10-06）。
#
# 原因：本轮只做 selector / quota 对齐，**不顺手改网络策略**。共享 component 那份
# 与线上有一处实质差异（见下），照它 apply 会把入站面放宽。
#
# 规则逐条抄自线上实况，改动前请先对拍：
#   kubectl get networkpolicy -n video2md -o yaml

# **名字与线上相同**，但规则有一处差异：共享 component 的 nginx 边缘那条还带
#   ipBlock: 10.42.0.0/16（放行整个节点网段）
# 而线上没有。本文件按线上收窄——本轮只做对齐，不顺手放宽入站面。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: video2md
  labels:
    app.kubernetes.io/part-of: lcode-platform
spec:
  podSelector:
    {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: lcode-platform
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
