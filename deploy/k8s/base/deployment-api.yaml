# video2md API（hostNetwork 平移形态——与 compose 容器等位替换）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video2md-api
  namespace: video2md
  labels:
    app.kubernetes.io/name: video2md
    app.kubernetes.io/component: api
spec:
  # 串行信号量（V2MD_MAX_CONCURRENT_RUNS 默认 1）单写者语义——多副本前置=PG 状态面
  # （P2-1：RUNS/STATE/USERS/STORE=postgres + EVENTS=pg），不偷跑
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: video2md
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video2md
        app.kubernetes.io/component: api
    spec:
      hostNetwork: true   # 消费 obs(4318)/代理(17898) 回环；GPU 使用 Colab CLI
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: video2md
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120   # 在途视频 run 的收尾余量（watchdog 自愈口径）
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # PostgreSQL schema is the deployment gate. The migration container uses the
      # same image and secret file as the API, so a new revision cannot start against
      # an older schema.
      initContainers:
        - name: migrate
          image: video2md:0.1.3
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "video2md", "migrate"]
          env:
            - name: V2MD_ENV
              value: production
            - name: V2MD_SECRETS_FILE
              value: /run/video2md.env
          volumeMounts:
            - name: secrets
              mountPath: /run/video2md.env
              subPath: video2md.env
              readOnly: true
      containers:
        - name: api
          # registry 全名（D2 预构建收官）：制品=CI tag 构建产物（GHCR 灾备副本同 ID）。
          # 服务器落地流：gh run download artifact → gunzip | ctr import（无 packages 凭证通道）。
          image: video2md:0.1.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: V2MD_HOST
              value: 0.0.0.0        # kubelet 探针可达；公网面=iptables 8790 白名单（同 gpu_router 9700 模式）
            - name: V2MD_TRUST_XFF
              value: "on"
            - name: V2MD_ENV
              # 2026-09-27 第十四窗升回 production：google 凭证已配（secrets/video2md.env
              # V2MD_AUTH=google + TV 型 client——设备流桥 google_device 同批启用）；
              # P0-1 防呆（production 禁无鉴权）从此常态执法。纵深叠加 iptables 8790 白名单。
              value: production
            - name: V2MD_SECRETS_FILE
              value: /run/video2md.env
            # Production is a shared, multi-user deployment: all durable state and
            # cross-replica events live in the same PostgreSQL database. V2MD_PG_DSN
            # is supplied by the mounted secret file and is never committed here.
            - name: V2MD_CHECKPOINTER
              value: postgres
            - name: V2MD_RUNS_STORE
              value: postgres
            - name: V2MD_STATE_STORE
              value: postgres
            - name: V2MD_USERS_STORE
              value: postgres
            - name: V2MD_TASKS_STORE
              value: postgres
            - name: V2MD_PREFS_STORE
              value: postgres
            - name: V2MD_EVENTS
              value: pg
            - name: V2MD_REMOTE
              value: colab-cli
            - name: V2MD_OCR_REMOTE
              value: colab-cli
            - name: V2MD_CLIPS_REMOTE
              value: colab-cli
            - name: V2MD_CLIPS_SOURCE
              value: remote
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://127.0.0.1:4318   # 平台统一观测栈
            - name: OTEL_SERVICE_NAME
              value: video2md
            - name: V2MD_PROXY
              value: http://127.0.0.1:17898
            - name: V2MD_PROXY_DOMESTIC
              value: "1"
            - name: V2MD_WATCHDOG_ACTION
              value: exit   # 标 error 后退出（码 70），重启自愈并恢复队列
            - name: OBSIDIAN_VAULT
              value: /vault
          ports:
            - name: http
              containerPort: 8790
          volumeMounts:
            - name: colab-auth
              mountPath: /home/appuser/.config/colab-cli
            - name: data   # state.json/runs.json/checkpoints.sqlite/logs（docker 卷原位）
              mountPath: /app/data
            - name: vault   # vault 模式产物卷
              mountPath: /vault
            - name: secrets
              mountPath: /run/video2md.env
              subPath: video2md.env
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8790
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8790
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: 8790
            periodSeconds: 5
            failureThreshold: 30    # 150s 启动窗口
      volumes:
        - name: colab-auth
          hostPath:
            path: /home/ubuntu/stack/video2md/colab-auth
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/docker/volumes/video2md_v2md-data/_data
            type: Directory
        - name: vault
          hostPath:
            path: /var/lib/docker/volumes/video2md_vault/_data
            type: Directory
        - name: secrets
          hostPath:
            path: /home/ubuntu/stack/video2md/secrets
            type: Directory
        - name: tmp
          emptyDir: {}
