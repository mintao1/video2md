# video2md API（hostNetwork 平移形态——与 compose 容器等位替换）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video2md-api
  namespace: video2md
  labels:
    app.kubernetes.io/name: video2md
    app.kubernetes.io/component: api
spec:
  # 串行信号量（V2MD_MAX_CONCURRENT_RUNS 默认 1）单写者语义——多副本前置=PG 状态面
  # （P2-1：RUNS/STATE/USERS/STORE=postgres + EVENTS=pg），不偷跑
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: video2md
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video2md
        app.kubernetes.io/component: api
    spec:
      hostNetwork: true   # 消费 obs(4318)/gpu-router(9700) 回环
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: video2md
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120   # 在途视频 run 的收尾余量（watchdog 自愈口径）
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # PostgreSQL schema is the deployment gate. The migration container uses the
      # same image and secret file as the API, so a new revision cannot start against
      # an older schema.
      initContainers:
        - name: migrate
          image: video2md:0.2.0-hotfix-20261021g
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "video2md", "migrate"]
          env:
            - name: V2MD_ENV
              value: production
            # config 启动期校验与 api 容器同口径（secret 可能设 V2MD_AUTH=google）
            - name: V2MD_PUBLIC_BASE_URL
              value: https://ferosse.tech
            - name: V2MD_WEB_BASE_URL
              value: https://ferosse.tech
            - name: V2MD_GOOGLE_OAUTH_TIMEOUT_S
              value: "15"
            - name: V2MD_GOOGLE_OAUTH_PROXY_URL
              value: http://127.0.0.1:18080
            - name: V2MD_SECRETS_FILE
              value: /run/video2md.env
          volumeMounts:
            - name: secrets
              mountPath: /run/video2md.env
              subPath: video2md.env
              readOnly: true
      containers:
        - name: api
          # registry 全名（D2 预构建收官）：制品=CI tag 构建产物（GHCR 灾备副本同 ID）。
          # 服务器落地流：gh run download artifact → gunzip | ctr import（无 packages 凭证通道）。
          image: video2md:0.2.0-hotfix-20261021g
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: V2MD_HOST
              value: 0.0.0.0        # kubelet 探针可达；公网面=iptables 8790 白名单（同 gpu_router 9700 模式）
            - name: V2MD_TRUST_XFF
              value: "on"
            - name: V2MD_ENV
              value: production
            - name: V2MD_AUTH
              value: google
            - name: V2MD_AUTH_PROVIDERS
              value: google
            # 同源部署：API 与 Vite bundle 都在 ferosse.tech。Google 控制台登记的
            # redirect_uri 须逐字等于 https://ferosse.tech/auth/google/callback。
            - name: V2MD_PUBLIC_BASE_URL
              value: https://ferosse.tech
            - name: V2MD_WEB_BASE_URL
              value: https://ferosse.tech
            - name: V2MD_GOOGLE_OAUTH_TIMEOUT_S
              value: "15"
            # hostNetwork Pod 通过 4c 本机 SSH tunnel 访问 lcode-cn CONNECT relay。
            - name: V2MD_GOOGLE_OAUTH_PROXY_URL
              value: http://127.0.0.1:18080
            - name: V2MD_SECRETS_FILE
              value: /run/video2md.env
            # Production is a shared, multi-user deployment: all durable state and
            # cross-replica events live in the same PostgreSQL database. V2MD_PG_DSN
            # is supplied by the mounted secret file and is never committed here.
            - name: V2MD_CHECKPOINTER
              value: postgres
            - name: V2MD_RUNS_STORE
              value: postgres
            - name: V2MD_STATE_STORE
              value: postgres
            - name: V2MD_USERS_STORE
              value: postgres
            - name: V2MD_TASKS_STORE
              value: postgres
            - name: V2MD_PREFS_STORE
              value: postgres
            - name: V2MD_EVENTS
              value: pg
            - name: V2MD_REMOTE
              value: http://127.0.0.1:9700
            - name: V2MD_OCR_REMOTE
              value: http://127.0.0.1:9700
            - name: V2MD_CLIPS_REMOTE
              value: http://127.0.0.1:9700
            - name: V2MD_CLIPS_SOURCE
              value: remote
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://127.0.0.1:4318   # 平台统一观测栈
            - name: OTEL_SERVICE_NAME
              value: video2md
            - name: V2MD_PROXY_DOMESTIC
              value: "1"
            - name: V2MD_WATCHDOG_ACTION
              value: exit   # 标 error 后退出（码 70），重启自愈并恢复队列
            - name: OBSIDIAN_VAULT
              value: /vault
          ports:
            - name: http
              containerPort: 8790
          volumeMounts:
            - name: data   # state.json/runs.json/checkpoints.sqlite/logs（docker 卷原位）
              mountPath: /app/data
            - name: vault   # vault 模式产物卷
              mountPath: /vault
            - name: secrets
              mountPath: /run/video2md.env
              subPath: video2md.env
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8790
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8790
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: 8790
            periodSeconds: 5
            failureThreshold: 30    # 150s 启动窗口
      volumes:
        - name: data
          hostPath:
            path: /var/lib/docker/volumes/video2md_v2md-data/_data
            type: Directory
        - name: vault
          hostPath:
            path: /var/lib/docker/volumes/video2md_vault/_data
            type: Directory
        - name: secrets
          secret:
            secretName: video2md-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
