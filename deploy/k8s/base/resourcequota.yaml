# ns 治理（平台同款：quota 封顶 + LimitRange 兜底）
apiVersion: v1
kind: ResourceQuota
metadata:
  name: video2md-quota
  namespace: video2md
spec:
  hard:
    pods: "4"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: video2md-limits
  namespace: video2md
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
