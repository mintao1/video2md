# video2md Service（平台基线：ClusterIP + label selector）
# hostNetwork 模式下 Service 主要用于 K8s 内部 DNS 解析。
apiVersion: v1
kind: Service
metadata:
  name: video2md
  namespace: video2md
  labels:
    app.kubernetes.io/name: video2md
    app.kubernetes.io/part-of: lcode-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: video2md
  ports:
    - name: http
      port: 8790
      targetPort: 8790
      protocol: TCP