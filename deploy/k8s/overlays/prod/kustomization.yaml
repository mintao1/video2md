apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: video2md

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: video2md-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: V2MD_ENV
          value: "production"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: "INFO"

commonLabels:
  app.kubernetes.io/environment: production