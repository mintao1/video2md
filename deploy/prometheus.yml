# Prometheus：只抓 collector 的 prometheus exporter（app 指标经 OTLP 汇聚于此，不直抓 app）。
# 告警链（2026-09-23）：rule_files 评估 deploy/prometheus-rules.yml → Alertmanager(127.0.0.1:9093)
# → feishu-webhook 转译 → 飞书群机器人（见 deploy/alertmanager.yml 与 docker-compose.obs.yml）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: video2md
    static_configs:
      - targets: ["127.0.0.1:8889"]
