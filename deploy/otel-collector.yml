# otel-collector 配置：video2md 的唯一遥测出口（2026-09-22 定稿架构）。
#   traces  → otlphttp → Langfuse Cloud（经宿主回环代理出墙；batch+retry+queue 扛抖动）
#   metrics → prometheus exporter :8889（prometheus 来抓，进 Grafana）
# 入向只绑 127.0.0.1:4318（video2md 同机 host 网络直投，公网零暴露）。
# env（compose env_file secrets/obs.env 注入）：
#   LANGFUSE_HOST  默认 https://cloud.langfuse.com
#   LANGFUSE_BASIC base64("<LANGFUSE_PK>:<LANGFUSE_SK>")——生成：printf '%s:%s' "$PK" "$SK" | base64
#   HTTPS_PROXY    http://127.0.0.1:17897（宿主 SSH 隧道出口；collector 与 app 同纪律走它出墙）

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:               # 第一道：内存闸，防爆 collector 拖垮小机
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_HOST}/api/public/otel
    headers:
      Authorization: Basic ${env:LANGFUSE_BASIC}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 10m
    sending_queue:
      enabled: true
      queue_size: 1000
  prometheus:
    endpoint: 127.0.0.1:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
