# Prometheus 告警规则（video2md 运维三件套 2026-09-23）。
# 指标来源：collector 的 prometheus exporter（127.0.0.1:8889，经 OTLP 汇聚，见 deploy/otel-collector.yml）。
# 通知链：Prometheus → Alertmanager(127.0.0.1:9093) → feishu-webhook 转译 → 飞书群机器人
# （deploy/alertmanager.yml + deploy/feishu_webhook.py；密钥 FEISHU_WEBHOOK_URL 在 secrets/obs.env）。
#
# 口径说明：
# - 指标经 OTLP 批导出（15s），app 重启后 counter 归零——一律用 increase()/absent() 而非绝对值。
# - v2md_run_active 上限恒为 1（串行信号量），不设「过载」类规则；队列饿死用 QueueStarving。
# - absent_over_time 依赖 collector 的 metric_expiration（5m）：指标流断 5 分钟后序列才过期，
#   之后 absent 才为真——Video2mdSilent 的 10m 窗口已覆盖该延迟。
groups:
  - name: video2md
    rules:
      # 整链沉默：app/collector/导出链任一环挂掉，指标流断 10m。最高优先级——
      # 「不能依赖自己的基础设施报自己的警」的仓内兜底（外部死人开关见 V2MD_DEADMAN_PING_URL）。
      - alert: Video2mdSilent
        expr: absent_over_time(v2md_queue_queued[10m]) == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "video2md 指标流沉默 10m（app/collector/导出链任一环挂了）"

      # 看门狗判定卡死（video2md/watchdog.py）：run 已标 error；action=mark 时需人工重启恢复队列。
      - alert: WatchdogTripped
        expr: increase(v2md_watchdog_trips_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "看门狗判定 run 卡死（心跳超时），已标 error；mark 模式需人工重启恢复队列"

      # run 终态 error（管线失败/熔断/框架异常）。30m 窗口聚合：重启后 counter 归零不误报。
      - alert: RunFailed
        expr: increase(v2md_runs_total{status="error"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "30m 内出现 error 终态 run（查看 runs.json errors / Langfuse trace）"

      # 部分失败：run 跑完但有条目丢（14P 合集丢 2 集这类「静默少货」）。
      - alert: RunPartial
        expr: increase(v2md_runs_total{status="partial"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "1h 内出现 partial 终态 run（部分条目失败，见 partial_failures）"

      # 阶段熔断：连续同因失败判全局故障（token 过期/断网/风控），管线被主动终止。
      - alert: CircuitBreakerTripped
        expr: increase(v2md_circuit_breaker_trips_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "阶段熔断触发（连续同因失败：认证/网络/风控类全局故障）"

      # 队列饿死：积压 ≥3 且 30m 无消化——多半是卡死 run 占着串行信号量（看门狗 mark 模式的
      # 后续效应）或下游算力池整体不可用。
      - alert: QueueStarving
        expr: v2md_queue_queued >= 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "队列积压 ≥3 持续 30m（串行信号量被占或算力池不可用）"

      # LLM 连续失败：3 次重试后仍 failed 的调用 30m 内 >3 次——端点侧故障/欠费/限流。
      - alert: LLMFailures
        expr: increase(v2md_llm_requests_total{status="failed"}[30m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "30m 内 LLM 调用失败 >3 次（端点故障/欠费/限流）"

      # 抓取目标掉线：collector 的 prometheus exporter 不可抓（collector 挂/端口丢）。
      - alert: CollectorDown
        expr: up{job="video2md"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "collector prometheus exporter 抓取失败 ≥2m（otel-collector 挂了？）"
