# video2md 公网唯一入口（P0-4）——api 绑 127.0.0.1:8790，本配置是它面前的 nginx。
# 拓扑：生产 API 使用 deploy/docker-compose.prod.yml；nginx 由主机/平台反代托管
# （host 网络，绑 80；443 见文末 TLS 模板）。
# 信任锚：api 只在回环可达 → 到达它的连接必经本 nginx → X-Forwarded-For 尾位可信
# （compose 里配套 V2PDF_TRUST_XFF=on，应用层 IP 限流才记账真实客户端）。
# 改这里 = 改生产入口；scripts/smoke_proxy.sh 用 sed 换 upstream/端口后验证同一份配置。

# 匿名面兜底限流：跨副本共享语义由本层承担（应用层滑窗是进程内的，多副本各算各的）。
# 通用 120r/m/IP burst 60——正常浏览/SSE/轮询无感；设备流两端点 30r/m 对齐应用层闸。
limit_req_zone $binary_remote_addr zone=v2pdf_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=v2pdf_device:10m   rate=30r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;

    # 对齐应用层 V2PDF_UPLOAD_MAX_GB=2GB（应用超限回 413+删半截，这里先挡更大的）
    client_max_body_size 2g;

    # 信息收敛（P0-4 验收）：OpenAPI 面在网关侧 deny——api 进程仍开着（回环排障用），
    # 公网不得见。
    location = /docs         { return 403; }
    location = /openapi.json { return 403; }
    location = /redoc        { return 403; }
    # /queue 是内部算力池看门狗口，不是公网 API。
    location = /queue        { return 404; }

    # SSE：关缓冲是硬要求（缓冲会把事件流攒到 8k/超时才吐，客户端表现为「卡住」）。
    # api 侧已带 X-Accel-Buffering: no，这里显式声明双保险 + 长读超时（3h 转录全程旁观）。
    location ~ ^/runs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10800s;
    }

    # 设备流两端点：更紧的匿名限流（与应用层 30/min/IP 双层对齐）
    location = /auth/device/code {
        limit_req zone=v2pdf_device burst=10 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location = /auth/device/token {
        limit_req zone=v2pdf_device burst=10 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 其余全部透传 + 通用限流兜底
    location / {
        limit_req zone=v2pdf_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

# ── TLS 终结模板（部署期人工接线，P0-4 留的口）────────────────────────────────
