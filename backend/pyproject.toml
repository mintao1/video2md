[project]
name = "video2pdf"
version = "0.2.0"  # 库版本（/healthz 经 config.py 读它）；发版 SSOT=git tag（CI→GHCR），k8s deployment image 行随发版对拍（平面对齐轮 2026-09-29 声明）
description = "视频 → Obsidian 笔记（LangGraph 编排：本地转写/抽帧 OCR + LLM 整理；Dify 已抽离）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "google-colab-cli==0.7.4; sys_platform != 'win32'",
    "pillow>=10.4",
    "pyyaml>=6.0.3",
    "websocket-client>=1.8",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",  # POST /uploads（multipart 流式上传面；镜像 --no-dev 也要有）
    "yt-dlp>=2025.9.0",
    "uvicorn>=0.30",
    # 遥测出口：platform-otel-sdk（含 opentelemetry-sdk + exporter 传递依赖）
    "platform-otel-sdk>=0.1.0",
    "google-auth>=2.58.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# macOS 本地开发：Vision 框架 OCR（Linux/云服务器不装，OCR 走 V2PDF_OCR_REMOTE 远程池）
mac = [
    "pyobjc-framework-Vision>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
]
# 评测旁路（backend/scripts/eval_notes.py；judge 走自有 LLM 端点；ragas 带入 langchain-core，
# 仅此路径 import，graph 运行时不染）
evals = [
    "deepeval>=3.0",
    "ragas>=0.3",
    "langfuse>=3.0",
    # ragas 0.4.3 仍 import langchain_community.chat_models.vertexai——该模块在
    # langchain-community 0.4 被删（包已 sunset），钉 0.3 系否则 ragas 整体 import 失败
    "langchain-community>=0.3.27,<0.4",
]

[tool.uv]
package = false

[tool.uv.sources]
platform-otel-sdk = { path = "vendor/platform-otel-sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# 保守集：pyflakes + 关键 pycodestyle + isort；不动现有代码风格
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# 分段脚本式测试：每段后 import 本段用的桩（直跑设计，同 gpu-router 先例）
"test_*.py" = ["E402"]
"tests/*" = ["E402"]
# Colab 单文件参考：分步 pip install + 按需导入是有意的
"gpu_plugins/v2md/reference/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
# langgraph/httpx 等无内联桩，缺桩不报错
ignore_missing_imports = true
# 非 strict 起步：函数体内部类型错误也查
check_untyped_defs = true
