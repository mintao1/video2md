[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-otel-sdk"
version = "0.1.0"
description = "平台统一 OTel SDK：provider 管理 + RunLog→traces/metrics 桥"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.34.0,<2.0.0",
    "opentelemetry-sdk>=1.34.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.34.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "opentelemetry-test-utils>=0.55b0",
]

[tool.hatch.build.targets.wheel]
packages = ["platform_otel_sdk"]