# ⚠️ 服务器已退役（2026-09-26 obs 双栈合并——平台 Phase 1.1/M1）：观测归
#   ~/stack/platform-obs 统一栈服务全部产品，本文件**仅剩 Mac 本地预览用途**
#   （本地若需 parity 建议直接跑 platform-obs 的 compose——平台册 D4③）。
#   服务器发版/恢复脚本已不再叠本文件（deploy.sh/restore.sh 同日修正）。
# ------------------------------------------------------------------
# 观测栈 override：otel-collector + prometheus + grafana + alertmanager + feishu-webhook
#（2026-09-22 定稿架构；2026-09-23 加告警链）。
# 用法：docker compose -f docker-compose.yml -f docker-compose.obs.yml up -d
#
# 拓扑：video2md ─OTLP→ collector:4318 ─┬─ traces → Langfuse Cloud（HTTPS_PROXY 出墙）
#                                       └─ metrics → :8889 → prometheus → grafana
# 告警链：prometheus 规则（deploy/prometheus-rules.yml）→ alertmanager:9093
#         → feishu-webhook:9760 转译 → 飞书群机器人（AM 无原生飞书 receiver）
# 与主栈同 host 网络：出口代理在宿主回环（桥接网络够不到）。
# 全部只绑 127.0.0.1，公网零暴露（公网唯一入口 = api 侧反代 TLS）。查看：
#   ssh -L 3000:127.0.0.1:3000 <server>   → http://127.0.0.1:3000（Grafana，admin 密码见 secrets/obs.env）
#   Langfuse 直接开 https://cloud.langfuse.com
# 凭证：secrets/obs.env（gitignore，部署时手工放）：
#   LANGFUSE_HOST=https://cloud.langfuse.com
#   LANGFUSE_BASIC=base64("PK:SK")     # printf '%s:%s' "$PK" "$SK" | base64
#   HTTPS_PROXY=http://127.0.0.1:<回环代理端口>
#   GF_SECURITY_ADMIN_PASSWORD=<grafana admin 密码>
#   FEISHU_WEBHOOK_URL=https://open.feishu.cn/open-apis/bot/v2/hook/<uuid>  # 飞书群机器人（告警链）

volumes:
  obs-prometheus: {}
  obs-grafana: {}

services:
  video2md:
    environment:
      # 遥测出口切到本机 collector（未起本栈时删此行即回退 LANGFUSE 直连/纯本地）
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    restart: unless-stopped
    network_mode: host   # 出墙代理在宿主回环；4318/8889 的 127.0.0.1 绑定见 deploy/otel-collector.yml
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/otel-collector.yml:/etc/otelcol/config.yml:ro
    env_file:
      - path: ./secrets/obs.env
        required: false
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    network_mode: host   # 抓 127.0.0.1:8889（collector）；自身只绑回环
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - obs-prometheus:/prometheus
    mem_limit: 768m

  # 告警路由：Prometheus rule_files 评估结果发这里 → 转译器 → 飞书（见 deploy/alertmanager.yml）
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    network_mode: host   # 收 127.0.0.1:9093（prometheus 同机直投）
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    mem_limit: 128m

  # AM → 飞书卡片转译器：复用 video2md 镜像（fastapi/httpx 都在），不另建 Dockerfile。
  # 密钥 FEISHU_WEBHOOK_URL 在 secrets/obs.env；未配置时转译器对 /alert 回 503（AM 会重试）。
  feishu-webhook:
    image: video2md
    restart: unless-stopped
    network_mode: host   # AM 在宿主回环 9093，转译器也只绑回环 9760
    command: ["python", "/app/deploy/feishu_webhook.py"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/feishu_webhook.py:/app/deploy/feishu_webhook.py:ro
    env_file:
      - path: ./secrets/obs.env
        required: false
    mem_limit: 128m

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    network_mode: host   # GF_SERVER_HTTP_ADDR=127.0.0.1：只露回环，经 SSH 隧道/受控反代查看
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # 匿名只读：面板仅回环/隧道可达（公网零暴露），免登录直接看（写操作仍需 admin）
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
    env_file:
      - path: ./secrets/obs.env   # GF_SECURITY_ADMIN_PASSWORD
        required: false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - obs-grafana:/var/lib/grafana
    mem_limit: 512m
