name: Retire obsolete project namespaces

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect or delete obsolete stateless namespaces"
        required: true
        type: choice
        options: [inspect, delete]

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect or retire high-confidence obsolete namespaces
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "MODE=${MODE} bash -s" <<'REMOTE'
          set -euo pipefail
          INSPECT_NAMESPACES=(bookserve sing-train vquote)
          DELETE_NAMESPACES=(sing-train vquote)
          echo "=== inspected namespaces ==="
          sudo k3s kubectl get ns "${INSPECT_NAMESPACES[@]}" --ignore-not-found
          echo "=== inspected workloads ==="
          for ns in "${INSPECT_NAMESPACES[@]}"; do
            echo "--- $ns ---"
            sudo k3s kubectl get all,pvc,ingress,configmap,secret -n "$ns" --ignore-not-found || true
          done
          if [[ "$MODE" == "inspect" ]]; then
            # Read-only disk inventory: every command below only lists or sizes.
            echo "=== disk inventory (read-only) ==="
            hostname
            df -h / /var/lib/rancher/k3s 2>/dev/null || df -h /
            echo "--- namespaces / pods ---"
            sudo k3s kubectl get ns --no-headers | awk '{print $1}' | tr '\n' ' '; echo
            sudo k3s kubectl get pods -A --no-headers | awk '{print $1, $2, $4}'
            echo "--- k3s images (in-use marked by crictl ps) ---"
            sudo k3s crictl images 2>/dev/null | sort -k4 -h || true
            echo "--- images used by running containers ---"
            sudo k3s crictl ps -o json 2>/dev/null | grep -o '"image": *"[^"]*"' | sort -u || true
            echo "--- docker ---"
            docker system df 2>/dev/null || true
            docker images --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedSince}}' 2>/dev/null | head -50 || true
            echo "--- big directories ---"
            sudo du -xsh /var/lib/docker /var/lib/rancher/k3s/agent/containerd /var/lib/rancher/k3s/storage /var/log /home/* /root /opt /srv /tmp 2>/dev/null | sort -h || true
            echo "--- PVC data (local-path) ---"
            sudo du -sh /var/lib/rancher/k3s/storage/* 2>/dev/null | sort -h || true
            echo "--- deployment checkouts ---"
            du -sh ~/stack/* 2>/dev/null | sort -h || true
            echo "--- home top level ---"
            sudo du -xsh ~/* ~/.cache 2>/dev/null | sort -h | tail -25 || true
            exit 0
          fi
          for ns in "${DELETE_NAMESPACES[@]}"; do
            if sudo k3s kubectl get pvc -n "$ns" --no-headers 2>/dev/null | grep -q .; then
              echo "refusing to delete $ns: PVC exists" >&2
              exit 20
            fi
          done
          for ns in "${DELETE_NAMESPACES[@]}"; do
            sudo k3s kubectl delete namespace "$ns" --ignore-not-found --wait=true --timeout=120s
          done
          echo "=== reclaim unused runtime cache ==="
          docker builder prune --all --force || true
          docker system prune --all --force || true
          sudo k3s crictl rmi --prune || true
          echo "=== filesystem after retirement ==="
          df -h /
          REMOTE
