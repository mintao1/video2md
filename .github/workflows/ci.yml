name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # 打 tag 同样把关（test/lint/web-integration/gate）；镜像发布走部署时节点构建（ADR-0023）
  pull_request:
  workflow_dispatch: {}   # 手动触发（CI 侧环境性失败的隔离调试面——2026-09-27 反代冒烟连败排查用）

jobs:
  # 离线测试：pytest 契约测试 + 8 个脚本式测试 + 进程级 mockpool 全链冒烟（假 LLM 档，零 token）
  # 注：test_e2e.sh（say 合成语音 + Vision OCR）是 Mac 开发机专属验收，不进 Linux CI
  test:
    runs-on: ubuntu-latest
    services:
      # P3 PG 档真库测试（test_pg_stores.py 无 DSN 自动 skip，服务在则跑）
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2md
          POSTGRES_PASSWORD: v2md
          POSTGRES_DB: v2md
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2md"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      V2MD_TEST_PG_DSN: postgresql://v2md:v2md@127.0.0.1:5432/v2md
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install ffmpeg（test_e2e.sh 合成视频需要）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # 不带 mac extra（Linux 无 Vision OCR，走远程池路径）；不带 evals extra（test_evals.py 假桩）
      # 布局口径：pyproject 在 backend/，Python 侧 uv/pytest/脚本式测试一律在 backend/ 下跑
      - run: uv sync --frozen
        working-directory: backend
      - name: pytest（API 契约 + acctkit）
        run: uv run pytest tests/test_api_contract.py tests/test_acctkit.py tests/test_google_cert_cache.py -q
        working-directory: backend
      - name: 个人租户 Colab 评测（普通用户授权、同账号核对、凭证与执行隔离；离线）
        run: uv run pytest tests/test_colab_auth.py tests/test_colab_cli.py tests/test_tenant_colab_eval_set.py -q
        working-directory: backend
      - name: 生产就绪防回退门禁自测（不访问生产、不读取密钥）
        run: python3 scripts/check_production_readiness.py --self-test
      - name: 生产全站修复评测契约（部署/路由/OAuth 防回退）
        run: uv run pytest tests/test_production_readiness_gate.py -q
        working-directory: backend
      - name: 逐阶段生产评测防回退（正反例、真实失败回放；零 token）
        run: >-
          uv run pytest tests/test_production_pipeline_stage_eval_set.py
          tests/test_production_billing_eval_set.py
          tests/test_video_resolver_runtime_eval_set.py
          tests/test_colab_warm_lifecycle_eval_set.py
          tests/test_colab_source_routing_eval_set.py
          tests/test_production_integration_regression_eval_set.py
          tests/test_glm_review_eval_set.py -q
        working-directory: backend
      - name: GLM 联调 11 条批注证据回放（不代表完整生产门禁通过）
        run: python3 scripts/check_glm_review_regressions.py
      - name: B站联调 44 条批注与132反例、隔离及运维边界防回退（离线、零token）
        run: >-
          uv run pytest tests/test_bilibili_review_eval_set.py
          tests/test_bilibili_review_operations.py tests/test_bilibili_test_isolation.py
          tests/test_bilibili_public_fallback.py -q
        working-directory: backend
      - name: B站历史证据回放（保留未关闭项，不代表新生产验收）
        run: python3 scripts/check_bilibili_review_regressions.py
      - name: LLM 调用与 usage 回归（MockTransport，全离线）
        run: uv run pytest tests/test_llm.py tests/test_opencode_llm_contract.py -q
        working-directory: backend
      - name: 失败后费用、重试用量与扣款证据防回退（离线、零 token）
        run: >-
          uv run pytest tests/test_failure_cost_regressions.py
          tests/test_note_embed_regressions.py
          tests/test_reader_readiness_eval.py
          tests/test_production_failure_cost_eval_set.py
          tests/test_opencode_usage_reconciliation.py
          tests/test_usage_backfill.py
          tests/test_kaggle_followup_eval_set.py -q
        working-directory: backend
      - name: 内容质量提前拦截（零模型调用 / partial 原因落盘）
        run: uv run pytest tests/test_transcript_quality_admission.py -q
        working-directory: backend
      - name: 生产续修43条批注评测与发布预检防回退（历史回放，不替代生产验收）
        run: >-
          uv run pytest tests/test_resolution_annotations.py
          tests/test_resolution_operations.py -q
        working-directory: backend
      - name: 生产前端8条批注评测（配置、运行态、OCR、媒体与去重；离线）
        run: uv run pytest tests/test_production_ui_annotation_eval_set.py -q
        working-directory: backend
      - name: 生产前端8条批注历史证据回放（保留失败与缺失项）
        run: python3 scripts/check_production_ui_annotations.py
      - name: 脚本式测试（7 个，全离线）
        run: |
          for t in test_graph test_observability test_otel_replay \
                   test_evals test_graph_obs test_resolve test_remote_clients; do
            echo "=== $t ==="
            uv run python3 "tests/$t.py"
          done
        working-directory: backend
      - name: 运维三件套测试（看门狗/备份脚本，全离线；obs 族 2026-09-27 随 M1 收口退役——
          告警规则校验归平台栈哨兵 platform-obs/test_alert_rules.py）
        run: |
          for t in test_watchdog test_backup_scripts; do
            echo "=== $t ==="
            uv run python3 "tests/$t.py"
          done
        working-directory: backend
      - name: PG 档真库测试（三存储适配器 + events 扇出；无 DSN 自动 skip）
        run: |
          uv run python3 tests/test_pg_stores.py
          uv run pytest tests/test_web_stores_pg.py -q
          uv run python3 tests/test_rescue_pg.py
        working-directory: backend
      - name: e2e（进程级 mockpool 冒烟：testsrc2 夹具 + 假 LLM，零 token，跨平台）
        run: bash scripts/smoke_ci.sh
      - name: 反代冒烟（P0-4：仓内 nginx.conf 的 deny/SSE/限流面）
        run: bash scripts/smoke_proxy.sh
      - name: 双副本冒烟（P1-4：可见性/属主甄别不抢/跨副本 SSE·取消/杀副本接管；复用本 job 的 PG service）
        run: bash scripts/smoke_replicas.sh
      # 告警配置校验（promtool/amtool）2026-09-27 随 obs 资产族退役删除：
      # 规则/AM 配置归 platform-obs 统一栈（其哨兵 platform-obs/test_alert_rules.py 承接结构校验）

  # 静态门禁：lint + 类型检查（配置在 pyproject.toml [tool.ruff]/[tool.mypy]）
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check video2md acctkit scripts
        working-directory: backend
      - run: uv run mypy video2md acctkit
        working-directory: backend
      - name: Follow-up evidence gate lint
        run: uv run ruff check ../scripts/check_kaggle_followup.py ../scripts/check_production_failure_cost.py ../scripts/check_reader_readiness.py ../scripts/backfill_opencode_usage.py ../scripts/check_resolution_annotations.py tests/test_kaggle_followup_eval_set.py tests/test_usage_backfill.py tests/test_google_cert_cache.py tests/test_note_embed_regressions.py tests/test_reader_readiness_eval.py tests/test_resolution_annotations.py tests/test_resolution_operations.py
        working-directory: backend
      - name: Tenant Colab catalog lint
        run: uv run ruff check ../scripts/check_tenant_colab_eval_set.py tests/test_tenant_colab_eval_set.py tests/test_colab_auth.py tests/test_colab_cli.py
        working-directory: backend
      - name: Production UI annotation eval lint
        run: uv run ruff check ../scripts/check_production_ui_annotations.py tests/test_production_ui_annotation_eval_set.py
        working-directory: backend

  web-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
        working-directory: frontend/web
      - run: npm run build
        working-directory: frontend/web
      - name: Production platform entry bundle gate
        run: node scripts/check_frontend_bundle.mjs frontend/web/dist
      - run: npm run test:integration
        working-directory: frontend/web
      - run: npm run test:regression
        working-directory: frontend/web

  # 生产镜像构建路径验证（此前只在服务器上验证过）
  # 2026-10-08：GHCR 灾备副本与 artifact 制品通道已终止（平台仓 ADR-0023 / HC-02）。
  # 镜像唯一来源=部署时节点构建 + sudo k3s ctr images import（templates/ci/deploy.yml）。
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t video2md:ci .
