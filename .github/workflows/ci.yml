name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # 打 tag 触发 release（镜像发布 GHCR；test/lint/plugin 对 tag 同样把关）
  pull_request:
  workflow_dispatch: {}   # 手动触发（CI 侧环境性失败的隔离调试面——2026-09-27 反代冒烟连败排查用）

jobs:
  # 离线测试：pytest 契约测试 + 8 个脚本式测试 + 进程级 mockpool 全链冒烟（假 LLM 档，零 token）
  # 注：test_e2e.sh（say 合成语音 + Vision OCR）是 Mac 开发机专属验收，不进 Linux CI
  test:
    runs-on: ubuntu-latest
    services:
      # P3 PG 档真库测试（test_pg_stores.py 无 DSN 自动 skip，服务在则跑）
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: v2md
          POSTGRES_PASSWORD: v2md
          POSTGRES_DB: v2md
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2md"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      V2MD_TEST_PG_DSN: postgresql://v2md:v2md@127.0.0.1:5432/v2md
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install ffmpeg（test_e2e.sh 合成视频需要）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # 不带 mac extra（Linux 无 Vision OCR，走远程池路径）；不带 evals extra（test_evals.py 假桩）
      - run: uv sync --frozen
      - name: pytest（契约 + acctkit）
        run: uv run pytest test_api_contract.py test_acctkit.py -q
      - name: 脚本式测试（8 个，全离线）
        run: |
          for t in test_graph test_llm test_observability test_otel_replay \
                   test_evals test_graph_obs test_resolve test_remote_clients; do
            echo "=== $t ==="
            uv run python3 "$t.py"
          done
      - name: 运维三件套测试（看门狗/备份脚本，全离线；obs 族 2026-09-27 随 M1 收口退役——
          告警规则校验归平台栈哨兵 platform-obs/test_alert_rules.py）
        run: |
          for t in test_watchdog test_backup_scripts; do
            echo "=== $t ==="
            uv run python3 "$t.py"
          done
      - name: PG 档真库测试（三存储适配器 + events 扇出；无 DSN 自动 skip）
        run: |
          uv run python3 test_pg_stores.py
          uv run python3 test_rescue_pg.py
      - name: e2e（进程级 mockpool 冒烟：testsrc2 夹具 + 假 LLM，零 token，跨平台）
        run: bash scripts/smoke_ci.sh
      - name: 反代冒烟（P0-4：仓内 nginx.conf 的 deny/SSE/限流面）
        run: bash scripts/smoke_proxy.sh
      - name: 双副本冒烟（P1-4：可见性/属主甄别不抢/跨副本 SSE·取消/杀副本接管；复用本 job 的 PG service）
        run: bash scripts/smoke_replicas.sh
      # 告警配置校验（promtool/amtool）2026-09-27 随 obs 资产族退役删除：
      # 规则/AM 配置归 platform-obs 统一栈（其哨兵 platform-obs/test_alert_rules.py 承接结构校验）

  # 静态门禁：lint + 类型检查（配置在 pyproject.toml [tool.ruff]/[tool.mypy]）
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check video2md acctkit scripts
      - run: uv run mypy video2md acctkit

  # Obsidian 插件（obsidian-plugin/）：类型检查 + 纯逻辑单测（zip-slip 闸/写盘计划/
  # 索引去重）+ 生产打包。Node 24 跑 .ts 走 type-stripping，与本地开发口径一致。
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - run: npm ci
        working-directory: obsidian-plugin
      - run: npx tsc --noEmit
        working-directory: obsidian-plugin
      - run: node --test src/*.test.ts
        working-directory: obsidian-plugin
      - run: npm run build
        working-directory: obsidian-plugin

  # 生产镜像构建路径验证（此前只在服务器上验证过）
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t video2md:ci .

  # 发布（终局布局·发布层）：打 v* tag → 镜像 push GHCR，不可变 tag 锚 git sha + semver。
  # 服务器部署/回滚走 scripts/deploy.sh <tag>；GHCR 镜像同时是灾备存档。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, plugin, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像元数据（semver + sha 不可变 tag + latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
