name: Maintenance cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect or cleanup"
        required: true
        type: choice
        options: [inspect, cleanup]

jobs:
  node-maintenance:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect and optionally reclaim rebuildable runtime cache
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "MODE=${MODE} bash -s" <<'REMOTE'
          set -euo pipefail
          echo '=== filesystem ==='
          df -h /
          echo '=== docker usage ==='
          docker system df || true
          echo '=== docker containers ==='
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo '=== k3s workloads ==='
          sudo k3s kubectl get pods -A -o wide || true
          echo '=== k3s image usage ==='
          sudo k3s crictl images || true
          if [[ "$MODE" == inspect ]]; then
            exit 0
          fi
          echo '=== prune unused Docker objects (volumes preserved) ==='
          docker system prune --all --force
          docker builder prune --all --force || true
          echo '=== prune unused K3s images ==='
          sudo k3s crictl rmi --prune || true
          echo '=== filesystem after cleanup ==='
          df -h /
          echo '=== docker usage after cleanup ==='
          docker system df || true
          REMOTE
