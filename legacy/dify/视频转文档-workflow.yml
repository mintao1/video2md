    - id: code_clean_url
      type: custom
      position:
        x: 500
        y: 260
      data:
        type: code
        title: 清洗链接（剥分享文本/抖音归一化）
        code_language: python3
        code: "import json, re\n\ndef main(url: str, part_items: str, force: str)\
          \ -> dict:\n    # 清洗链接：剥分享文本取 URL；抖音弹窗链接（modal_id）归一化为 /video/<id>\n   \
          \ # body 整体由 json.dumps 拼，杜绝链接里的引号/中文打碎 JSON\n    u = (url or \"\").strip()\n\
          \    m = re.search(r\"https?://[^\\s\\u4e00-\\u9fff\\\"'「」『』<>，。；]+\", u)\n\
          \    if m:\n        u = m.group(0)\n    m = re.search(r\"douyin\\.com/[^\\\
          s?#]*\\?(?:[^#\\s]*&)?modal_id=(\\d+)\", u)\n    if m:\n        u = f\"\
          https://www.douyin.com/video/{m.group(1)}\"\n    # force=on 时全量重跑（serve\
          \ 端 create_run 不标 skipped，覆盖 state 幂等）\n    f = (force or \"\").strip().lower()\
          \ in (\"on\", \"true\", \"1\", \"yes\")\n    body = json.dumps({\"url\"\
          : u, \"part_items\": (part_items or \"\").strip(), \"force\": f},\n    \
          \                  ensure_ascii=False)\n    return {\"url\": u, \"body\"\
          : body}\n"
        outputs:
          url:
            type: string
          body:
            type: string
        variables:
        - variable: url
          value_selector:
          - start_node
          - url
        - variable: part_items
          value_selector:
          - start_node
          - part_items
        - variable: force
          value_selector:
          - start_node
          - force
      width: 244
      height: 64
      positionAbsolute:
        x: 500
        y: 260
