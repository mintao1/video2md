    - id: code_entry_note
      type: custom
      position:
        x: 924
        y: 228
      data:
        type: code
        title: 组装本条目写盘 payload
        code_language: python3
        code: "import json\nimport re\n\n\ndef main(idx: str, organize: str, review:\
          \ str, meta_raw: str) -> dict:\n    # 单条目写盘 payload：正文取校对稿（≥50 字算有效），元数据归一成单条目对象\n\
          \    body = (review or \"\").strip()\n    if len(body) < 50:\n        body\
          \ = (organize or \"\").strip()\n    meta = {}\n    try:\n        m = json.loads(re.sub(r\"\
          ```(json)?|```\", \"\", (meta_raw or \"{}\").strip()).strip())\n       \
          \ if isinstance(m, dict):\n            meta = {\"title\": str(m.get(\"title\"\
          ) or \"\")[:100],\n                    \"tags\": [str(t).strip() for t in\
          \ (m.get(\"tags\") or []) if str(t).strip()][:8],\n                    \"\
          summary\": str(m.get(\"summary\") or \"\")[:300]}\n    except Exception:\n\
          \        meta = {}\n    return {\"body\": body,\n            \"title\":\
          \ meta.get(\"title\") or f\"视频笔记 {idx}\",\n            \"post_body\": json.dumps({\"\
          entry\": str(idx), \"body\": body, \"meta\": meta},\n                  \
          \                  ensure_ascii=False)}\n"
        outputs:
          body:
            type: string
          title:
            type: string
          post_body:
            type: string
        variables:
        - variable: idx
          value_selector:
