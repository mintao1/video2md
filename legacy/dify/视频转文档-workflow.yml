app:
  description: 视频 → Obsidian 笔记 + Dify RAG（全阶段编排：下载/转写/抽帧/OCR/内容选帧/剪节段/写盘/入库各自独立节点，画布可单步重跑；选帧由
    LLM 对照转录本内容决策，帧与节段吸附所在语音段）
  icon: 🎬
  icon_background: '#E0F2FE'
  mode: workflow
  name: 视频转文档
  use_icon_as_answer_icon: false
  kind: app
  version: 0.4.0
