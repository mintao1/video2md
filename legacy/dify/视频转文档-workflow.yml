          ok\": \"false\", \"text\": \"⚠️ 预检无响应（serve 未起？先 uv run video2md.py serve）\"\
          }\n    if j.get(\"ok\"):\n        names = \"、\".join(c.get(\"name\", \"\
          ?\") for c in j.get(\"checks\", []) if c.get(\"ok\"))\n        return {\"\
          ok\": \"true\", \"text\": f\"✅ 预检通过：{names}\"}\n    bad = [f\"- {c.get('name')}:\
          \ {c.get('detail', '')}\" for c in j.get(\"checks\", []) if not c.get(\"\
          ok\")]\n    return {\"ok\": \"false\", \"text\": \"❌ 预检未过：\\n\" + \"\\n\"\
          .join(bad)}\n"
