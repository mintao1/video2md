    - id: code_parse_select
      type: custom
      position:
        x: 7176
        y: 460
      data:
        type: code
        title: 过滤 LLM 选帧（滤非法名→payload）
        code_language: python3
        code: "import json\n\n\ndef main(blocks_json: str, mode: str, allowed_json:\
          \ str, total: str) -> dict:\n    # ③ 按合法帧名表过滤（去重、限长图注）→ select 阶段的 POST\
          \ payload\n    try:\n        blocks = json.loads(blocks_json or \"[]\")\n\
          \    except Exception:\n        blocks = []\n    try:\n        amap = json.loads(allowed_json\
          \ or \"{}\")\n    except Exception:\n        amap = {}\n    allowed = {}\n\
          \    for k, v in (amap.items() if isinstance(amap, dict) else []):\n   \
          \     try:\n            allowed[int(k)] = set(v)\n        except Exception:\n\
          \            continue\n    total_n = int(total or \"1\")\n\n    def filt(fr_list,\
          \ pool):\n        seen, fl = set(), []\n        for f in fr_list or []:\n\
          \            nm = (f.get(\"name\") or \"\").strip()\n            if nm and\
          \ nm in pool and nm not in seen:\n                seen.add(nm)\n       \
          \         fl.append({\"name\": nm, \"caption\": f.get(\"caption\") or \"\
          \"})\n        return fl\n\n    if mode == \"selections\":  # 多条目：每块独立过滤+去重（保留块结构对齐旧语义）\n\
          \        out = [{\"entry\": b.get(\"entry\", 1),\n                \"frames\"\
          : filt(b.get(\"frames\"), allowed.get(b.get(\"entry\", 1), set()))}\n  \
          \             for b in blocks]\n        out = [b for b in out if b[\"frames\"\
          ]]\n        payload = {\"selections\": out}\n        n_sel = sum(len(x[\"\
          frames\"]) for x in out)\n    else:  # 单条 frames 输出：池 = 条目1 的合法名；多条目场景取全体并集\n\
          \        pool = allowed.get(1, set())\n        if total_n > 1:\n       \
          \     pool = set().union(*allowed.values()) if allowed else set()\n    \
          \    fl = filt(blocks[0].get(\"frames\") if blocks else [], pool)\n    \
          \    payload = {\"selections\": [{\"entry\": 1, \"frames\": fl}]} if total_n\
          \ > 1 else {\"frames\": fl}\n        n_sel = len(fl)\n    note = \"\" if\
          \ n_sel else \"⚠️ LLM 未选出合法帧名，select 阶段将走本地启发式兜底\"\n    return {\"payload\"\
          : json.dumps(payload, ensure_ascii=False),\n            \"n_selected\":\
          \ str(n_sel), \"note\": note}\n"
        outputs:
          payload:
            type: string
          n_selected:
            type: string
          note:
            type: string
        variables:
        - variable: blocks_json
          value_selector:
          - code_select_blocks
          - blocks_json
        - variable: mode
          value_selector:
          - code_select_blocks
          - mode
        - variable: allowed_json
          value_selector:
          - code_manifest_allowed
          - allowed_json
        - variable: total
          value_selector:
          - code_fmt_run
          - total
      width: 244
      height: 64
      positionAbsolute:
        x: 7176
        y: 460
