    - id: llm_organize_entry
      type: custom
      position:
        x: 1224
        y: 68
      data:
        type: llm
        title: 整理正文（单条目）
        model:
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: Kimi-K3
          mode: chat
          completion_params:
            temperature: 0.4
            max_tokens: 16000
        prompt_template:
        - role: system
          text: "你是资深的技术文章撰稿人。任务：把带时间戳的一段视频转录本改写成一篇完整、流畅、忠实原意的中文文章（就像 3Blue1Brown\
            \ 官方文稿那样——是\"文稿改写\"，不是要点摘抄）。\n\n输入：【语音】为口播内容；【画面】为 OCR 提取的画面文字（幻灯片标题、字幕、代码、图表文字）。\n\
            \n改写规则：\n1. 忠实完整：按原叙事顺序展开，保留全部实质内容与论证过程，去掉口水词、重复、口误；允许把口语改成通顺书面语，但不得引入转录本之外的事实。禁止凭空补充外部知识。\n\
            2. 篇幅：正文约为转录本信息量的 60%–100%，宁可长而完整，不要压缩成提纲。\n3. 章节：用 `##` 分章（按内容自然分段，3–9\
            \ 章），复杂章内可用 `###` 小节。每个 `##` 标题末尾附时间戳，格式：`## 章节名（mm:ss）`。\n4. 关键句加粗：每章至少\
            \ 1 处 `**加粗**` 标出核心论断。\n5. 插图：在讲对应内容的位置嵌入可用帧，格式两行：\n   ![[attachments/帧文件名]]\n\
            \   *斜体图注（一句话，描述该帧画面内容）*\n   只能使用「可用帧清单」中列出的文件名，一个文件名最多嵌入一次，禁止编造；帧数量多时优先选画面文字与当章内容相关的。\n\
            6. 脚注：对术语、背景、与主线无关的补充，用 `[^n]` 内联标记，并在文末逐条给出定义（`[^n]: 说明文字`）。\n7. callout：视频中有演示、互动、思考、注意事项的地方，用\
            \ `> [!example] 思考题` 或 `> [!warning] 注意` 引用块呈现；不要滥用。\n8. 【画面】文字与相邻【语音】融合理解；直接引用画面文字时在句末标注（画面）。带\
            \ ⚠ 的低置信段谨慎采用、语义不明时略过。\n9. 专有名词、数字、代码、命令保持原样；简体中文输出。\n输出格式：Markdown 正文（不要一级标题、不要代码块包裹全文、不要\
            \ TL;DR、不要元数据 JSON——正文直接从引言段开始）。\n"
        - role: user
          text: '本条目：第 {{#loop_note.idx#}}/{{#code_fmt_run.total#}} 条（合集里的一集，只写这一条，不要写其它条目、不要输出分隔行）

            视频：{{#start_node.video_filename#}}（时长 {{#start_node.duration#}}）


            可用帧清单（文件名 [mm:ss] OCR内容；空=该条目无可用帧）：


            {{#http_get_entry_frames.body#}}


            转录本（[mm:ss] 时间戳）：


            {{#http_get_entry_transcript.body#}}

            '
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        retry_config:
          retry_enabled: true
          max_retries: 2
          retry_interval: 30000
        isInLoop: true
        loop_id: loop_note
      parentId: loop_note
      draggable: false
      selectable: false
