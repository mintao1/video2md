    - id: llm_select_frames
      type: custom
      position:
        x: 6576
        y: 460
      data:
        type: llm
        title: 内容选帧（对照转录本选图）
        model:
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: Kimi-K3
          mode: chat
          completion_params:
            temperature: 0.2
            max_tokens: 4000
        prompt_template:
        - role: system
          text: "你是视频配帧选帧员。任务：对照「转录本」的口播/画面内容，从「候选帧清单」里选出这篇视频笔记要嵌入的帧（截图/图表/公式/幻灯片），让「讲什么就配什么图」。\n\
            \n规则：\n1. 只能使用候选帧清单中出现的文件名，禁止编造清单外的名字。\n2. 选帧要跟转录本内容相关：优先选画面文字（OCR）与对应段落语音话题一致的帧；没有画面文字的候选帧在内容确实需要时可选（纯图/动画关键帧）。\n\
            3. 每个话题/章节 1–2 张，总量不要超过候选清单行数的 60%，单条目最多 12 张。\n4. 输出 JSON，不要任何解释、不要代码块：\n\
            \   单条目：{\"frames\": [{\"name\": \"帧文件名\", \"caption\": \"一句话图注\"}]}\n\
            \   多条目（候选清单含 ==== 条目 N/M：url ==== 分节头）：{\"selections\": [{\"entry\":\
            \ N, \"frames\": [{\"name\": \"...\", \"caption\": \"...\"}]}]}\n   caption\
            \ 用于笔记图注，一句话描述该帧画面内容及其与讲稿的关联。"
        - role: user
          text: '转录本（[mm:ss] 时间戳；多条目以 ==== 条目 N/M：url ==== 分节）：


            {{#http_get_transcript.body#}}


            候选帧清单（文件名 [mm:ss] OCR: 画面文字；OCR 为 — 表示无画面文字）：


            {{#http_get_candidates.body#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        retry_config:
          retry_enabled: true
          max_retries: 2
          retry_interval: 30000
      width: 244
      height: 98
      positionAbsolute:
        x: 6576
        y: 460
    - id: code_manifest_allowed
      type: custom
      position:
        x: 6576
        y: 620
      data:
        type: code
        title: 解包清单→每条目合法帧名表
        code_language: python3
        code: "import json\nimport re\n\n\ndef main(manifest: str) -> dict:\n    #\
          \ ① 只做「清单 → 每个条目的合法帧名表」，与 LLM 输出校验解耦（画布可见、可单独重跑）\n    # http 节点的 body 是\
          \ _run_outputs 的整个 JSON（{\"text\": ...}）——先解包取纯文本，\n    # 否则 \\S+\\.jpg\
          \ 在 JSON 转义文本上会把 {\"text\":\" 前缀吞进帧名，LLM 合法名全部对不上\n    m = manifest or \"\
          \"\n    try:\n        j = json.loads(m)\n        if isinstance(j, dict)\
          \ and isinstance(j.get(\"text\"), str):\n            m = j[\"text\"]\n \
          \   except Exception:\n        pass\n    # 按清单头「===== 条目 N/M：url =====」切分，取每个条目的合法帧名\n\
          \    allowed = {}\n    parts = re.split(r\"===== 条目 (\\d+)/\\d+：\", m)\n\
          \    for i in range(1, len(parts), 2):\n        try:\n            allowed[str(int(parts[i]))]\
          \ = re.findall(r\"(\\S+\\.jpg)\", parts[i + 1] or \"\")\n        except\
          \ Exception:\n            continue\n    if not allowed:  # 无分节头（单条目）→ 全清单都算\
          \ 1 号条目\n        allowed = {\"1\": re.findall(r\"(\\S+\\.jpg)\", m)}\n \
          \   return {\"allowed_json\": json.dumps(allowed, ensure_ascii=False)}\n"
        outputs:
          allowed_json:
            type: string
        variables:
        - variable: manifest
          value_selector:
          - http_get_candidates
          - body
      width: 244
      height: 64
      positionAbsolute:
        x: 6576
        y: 620
    - id: code_select_blocks
      type: custom
      position:
        x: 6876
        y: 460
      data:
        type: code
        title: 解析 LLM 选帧输出（保留块结构）
        code_language: python3
        code: "import json\nimport re\n\n\ndef main(llm_out: str) -> dict:\n    #\
          \ ② 解析 LLM 输出（容忍 ```json 围栏）→ 保留原始「块」结构的候选帧\n    # 保留块结构（而非拍平）是为了对齐旧语义：selections\
          \ 模式下每个块各自去重\n    try:\n        raw = (llm_out or \"\").strip()\n      \
          \  raw = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", raw, flags=re.S).strip()\n\
          \        obj = json.loads(raw) if raw else {}\n    except Exception:\n \
          \       obj = {}\n    def fr(f):\n        return {\"name\": (f.get(\"name\"\
          ) or \"\").strip(), \"caption\": (f.get(\"caption\") or \"\")[:80]}\n\n\
          \    sels = obj.get(\"selections\") or []\n    if sels:\n        blocks\
          \ = []\n        for s in sels:\n            try:\n                idx =\
          \ int(str(s.get(\"entry\", \"\")).strip())\n            except Exception:\n\
          \                idx = 1\n            blocks.append({\"entry\": idx, \"\
          frames\": [fr(f) for f in (s.get(\"frames\") or [])]})\n        mode = \"\
          selections\"\n    else:\n        blocks = [{\"entry\": 0, \"frames\": [fr(f)\
          \ for f in (obj.get(\"frames\") or [])]}]\n        mode = \"frames\"\n \
          \   return {\"blocks_json\": json.dumps(blocks, ensure_ascii=False), \"\
          mode\": mode}\n"
        outputs:
          blocks_json:
            type: string
          mode:
            type: string
        variables:
        - variable: llm_out
          value_selector:
          - llm_select_frames
          - text
