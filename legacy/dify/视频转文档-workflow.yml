      data:
        type: code
        title: 解析阶段状态
        code_language: python3
        code: "import json\n\nICON = {\"queued\": \"⏳\", \"running\": \"\U0001F504\
          \", \"done\": \"✅\", \"error\": \"❌\", \"none\": \"❔\"}\n\n\ndef _hint(v,\
          \ fallback):\n    try:\n        return max(1, min(60, int(str(v))))\n  \
          \  except Exception:\n        return fallback\n\n\ndef main(resp: str, poll_fails:\
          \ str, prev_hint: str) -> dict:\n    try:\n        n = int(str(poll_fails\
          \ or \"0\"))\n    except Exception:\n        n = 0\n    prev = _hint(prev_hint,\
          \ 5)\n    try:\n        j = json.loads(resp or \"{}\")\n    except Exception:\n\
          \        j = None\n    if isinstance(j, dict) and \"error\" in j and \"\
          status\" not in j:\n        # 服务级错误快照（404/409 PRECONDITION 等）：不是轮询抖动，立即判失败\n\
          \        return {\"progress_text\": f\"❌ {str(j.get('error'))[:180]}\",\n\
          \                \"done_flag\": \"false\", \"fail_flag\": \"true\", \"poll_fails\"\
          : \"0\",\n                \"wait_hint\": str(prev)}\n    if not isinstance(j,\
          \ dict) or \"status\" not in j:\n        n += 1\n        return {\"progress_text\"\
          : f\"⚠️ 阶段响应无法解析（连续 {n} 次，5 连判失败）\",\n                \"done_flag\": \"\
          false\",\n                \"fail_flag\": \"true\" if n >= 5 else \"false\"\
          ,\n                \"poll_fails\": str(n),\n                \"wait_hint\"\
          : str(min(60, prev * 2))}\n    hint = _hint(j.get(\"wait_hint\"), prev)\n\
          \    st = j.get(\"status\", \"none\")\n    if j.get(\"error\"):\n      \
          \  st = \"error\"\n    text = f\"{ICON.get(st, st)} {j.get('progress') or\
          \ j.get('stage') or '排队中'}\"\n    if j.get(\"budget_s\") and st == \"running\"\
          :\n        text += f\"（已用 {j.get('elapsed_s', 0)}s / 自适应预算 {j['budget_s']}s）\"\
          \n    if j.get(\"note\"):\n        text += f\"\\n\U0001F4DD {j['note']}\"\
