      data:
        type: code
        title: 格式化进度
        code_language: python3
        code: "import json\n\nICON = {\"queued\": \"⏳ 排队中\", \"running\": \"\U0001F504\
          \ 处理中\", \"done\": \"✅ 完成\", \"error\": \"❌ 失败\"}\n\n\ndef main(resp: str)\
          \ -> dict:\n    try:\n        j = json.loads(resp or \"{}\")\n    except\
          \ Exception:\n        return {\"text\": \"⚠️ 本地作业服务未响应（video2md serve 未运行？）\"\
          }\n    st = j.get(\"status\", \"none\")\n    if st == \"none\":\n      \
          \  return {\"text\": \"还没有处理过任何视频。在 url 字段粘贴 B站/YouTube 链接即可入队。\"}\n   \
          \ lines = [ICON.get(st, st) + f\"（任务 {j.get('id', '?')}，发起 {j.get('created',\
          \ '?')}）\",\n             f\"来源：{j.get('url', '')}\"]\n    if j.get(\"note\"\
          ):\n        lines.append(f\"产物：{j['note']}\")\n    if j.get(\"selfcheck\"\
          ):\n        lines.append(f\"检索自检：{j['selfcheck']}\")\n    if j.get(\"error\"\
          ):\n        lines.append(f\"错误：{j['error']}\")\n    tail = j.get(\"log\"\
          ) or []\n    if tail and st in (\"running\", \"queued\"):\n        lines.append(\"\
          最近日志：\")\n        lines += [\"· \" + t[:100] for t in tail[-3:]]\n    return\
          \ {\"text\": \"\\n\".join(lines)}\n"
        outputs:
          text:
            type: string
        variables:
        - variable: resp
          value_selector:
          - http_get
          - body
