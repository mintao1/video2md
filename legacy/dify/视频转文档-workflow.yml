        type: code
        title: ② 格式化 run 回执
        code_language: python3
        code: "import json\n\n\ndef main(resp: str) -> dict:\n    try:\n        j\
          \ = json.loads(resp or \"{}\")\n    except Exception:\n        return {\"\
          run_id\": \"\", \"total\": \"0\", \"text\": \"⚠️ 建 run 服务响应异常：\" + (resp\
          \ or \"空\")[:200]}\n    if j.get(\"error\"):\n        return {\"run_id\"\
          : \"\", \"total\": \"0\", \"text\": f\"⚠️ {j['error']}\"}\n    if j.get(\"\
          dedup\"):\n        return {\"run_id\": j.get(\"run_id\", \"\"), \"total\"\
          : str(j.get(\"total\") or 1),\n                \"text\": f\"♻️ 复用进行中的 run\
          \ {j.get('run_id')}（{j.get('total')} 条目），继续推进阶段\"}\n    n_skip = sum(1 for\
          \ e in j.get(\"entries\") or [] if e.get(\"skipped\"))\n    txt = f\"✅ run\
          \ {j.get('run_id')}：{j.get('total')} 条\"\n    if n_skip:\n        txt +=\
          \ f\"（{n_skip} 条已在历史 state 完成，将跳过）\"\n    return {\"run_id\": j.get(\"run_id\"\
          , \"\"), \"total\": str(j.get(\"total\") or 1), \"text\": txt}\n"
        outputs:
          run_id:
            type: string
          total:
            type: string
          text:
            type: string
        variables:
        - variable: resp
          value_selector:
