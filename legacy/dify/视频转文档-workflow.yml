    - id: code_split_notes_c
      type: custom
      position:
        x: 2020
        y: 1300
      data:
        type: code
        title: 拆篇（旧链路·校对稿优先）
        code_language: python3
        code: "import json\nimport re\n\n\ndef main(body: str, review_body: str) ->\
          \ dict:\n    # ① 选稿 + 分篇：校对稿有效（≥50 字）就用校对稿，否则用原稿；按 ===NOTE N=== 分隔行切篇\n\
          \    src = (review_body or \"\").strip()\n    if len(src) < 50:\n      \
          \  src = (body or \"\").strip()\n    sections = []\n    parts = re.split(r\"\
          ^===NOTE\\s+(\\d+)\\s*===$\", src, flags=re.M)\n    for i in range(1, len(parts),\
          \ 2):\n        try:\n            sections.append({\"entry\": int(parts[i]),\
          \ \"text\": (parts[i + 1] or \"\").strip()})\n        except Exception:\n\
          \            continue\n    if not sections:  # 单条目（无分隔行）→ 整篇算 1 号条目\n  \
          \      sections = [{\"entry\": 1, \"text\": src}]\n    return {\"sections_json\"\
          : json.dumps(sections, ensure_ascii=False),\n            \"n_notes\": str(len(sections))}\n"
        outputs:
          sections_json:
            type: string
          n_notes:
            type: string
        variables:
        - variable: body
          value_selector:
          - llm_organize
          - text
        - variable: review_body
          value_selector:
          - llm_review
          - text
      width: 244
      height: 64
      positionAbsolute:
        x: 2020
        y: 1300
    - id: code_parse_meta_c
      type: custom
      position:
        x: 2020
        y: 1440
      data:
        type: code
        title: 解析元数据 JSON（旧链路）
        code_language: python3
        code: "import json\nimport re\n\n\ndef main(meta_raw: str) -> dict:\n    #\
          \ ② 元数据归一：单条目对象或 {\"entries\": [...]} → {条目号: {title,tags,summary}}（JSON\
          \ 字符串）\n    meta = {}\n    try:\n        cleaned = re.sub(r\"```(json)?|```\"\
          , \"\", (meta_raw or \"{}\").strip()).strip()\n        m = json.loads(cleaned)\n\
          \        if isinstance(m, dict):\n            items = m[\"entries\"] if\
          \ isinstance(m.get(\"entries\"), list) else [m]\n            for em in items:\n\
          \                if not isinstance(em, dict):\n                    continue\n\
          \                try:\n                    idx = int(str(em.get(\"entry\"\
          ) or 1))\n                except Exception:\n                    idx = 1\n\
          \                meta[str(idx)] = {\"title\": str(em.get(\"title\", \"\"\
          ))[:100],\n                                  \"tags\": [str(t).strip() for\
          \ t in (em.get(\"tags\") or []) if str(t).strip()][:8],\n              \
          \                    \"summary\": str(em.get(\"summary\", \"\"))[:300]}\n\
          \    except Exception:\n        pass\n    return {\"meta_json\": json.dumps(meta,\
          \ ensure_ascii=False)}\n"
        outputs:
          meta_json:
            type: string
        variables:
        - variable: meta_raw
          value_selector:
          - llm_meta
          - text
      width: 244
      height: 64
      positionAbsolute:
        x: 2020
        y: 1440
    - id: code_agg
      type: custom
      position:
        x: 2300
        y: 1180
      data:
        type: code
        title: 组装输出（旧链路）
        code_language: python3
        code: "import json\n\n\ndef main(sections_json: str, meta_json: str) -> dict:\n\
          \    # ③ 组装：分篇正文 + 条目元数据 → notes（写盘用）+ 首篇 body/meta（旧链路出口）\n    try:\n \
          \       sections = json.loads(sections_json or \"[]\")\n    except Exception:\n\
          \        sections = []\n    try:\n        meta = json.loads(meta_json or\
          \ \"{}\")\n    except Exception:\n        meta = {}\n    notes = []\n  \
          \  for s in (sections if isinstance(sections, list) else []):\n        if\
          \ not isinstance(s, dict):\n            continue\n        try:\n       \
          \     idx = int(s.get(\"entry\") or 1)\n        except Exception:\n    \
          \        idx = 1\n        md = dict((meta or {}).get(str(idx)) or {\"title\"\
          : \"\", \"tags\": [], \"summary\": \"\"})\n        if not md.get(\"title\"\
          ):\n            md[\"title\"] = f\"视频笔记 {idx}\"\n        notes.append({\"\
          entry\": idx, \"body\": s.get(\"text\", \"\") or \"\", \"meta\": md})\n\
          \    if not notes:\n        notes = [{\"entry\": 1, \"body\": \"\", \"meta\"\
          : {\"title\": \"\", \"tags\": [], \"summary\": \"\"}}]\n    first = notes[0]\n\
          \    return {\"notes_json\": json.dumps(notes, ensure_ascii=False),\n  \
          \          \"note_body\": json.dumps({\"notes\": notes}, ensure_ascii=False),\n\
          \            \"body\": first[\"body\"], \"meta\": json.dumps(first[\"meta\"\
          ], ensure_ascii=False),\n            \"n_notes\": str(len(notes))}\n"
        outputs:
          notes_json:
            type: string
          note_body:
            type: string
          body:
            type: string
          meta:
            type: string
          n_notes:
            type: string
        variables:
        - variable: sections_json
          value_selector:
          - code_split_notes_c
          - sections_json
        - variable: meta_json
          value_selector:
          - code_parse_meta_c
          - meta_json
      width: 244
      height: 64
      positionAbsolute:
        x: 2300
        y: 1180
