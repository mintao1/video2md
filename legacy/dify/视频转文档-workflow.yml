          \        n = 1\n    wrote = '\"status\": \"done\"' in (resp or \"\") or\
          \ '\"status\":\"done\"' in (resp or \"\")\n    return {\"next_idx\": str(i\
          \ + 1),\n            \"done_flag\": \"true\" if i >= n else \"false\",\n\
          \            \"progress_text\": f\"note 阶段 · 条目 {i}/{n}\" + (\"\" if wrote\
          \ else \"（跳过/未写）\")}\n"
